<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="Heart Disease Prediction">
    <meta name="author" content="ECG Detection Team">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <style>
        body { padding-top: 70px; background: #f8f9fa; }
        .ex-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 60px 0; text-align: center; }
        .ex-header h1 { font-size: 2.5rem; font-weight: bold; }
        .ex-header h5 { font-size: 1.2rem; opacity: 0.9; }
        .ex-basic-1 { padding: 40px 0; }
        .card { border: none; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; padding: 12px 30px; border-radius: 25px; }
        .footer { background: #343a40; color: white; padding: 20px 0; text-align: center; margin-top: 50px; }
        .form-group label { font-weight: 600; color: #495057; }
        .navbar-brand { font-weight: bold; color: #667eea !important; }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white fixed-top shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="/index">
                <i class="fas fa-heartbeat text-danger mr-2"></i>ECG Detection
            </a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/index">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/about">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/login">Sign In</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Header -->
    <header class="ex-header">
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <h1>Heart Disease Prediction</h1>
                    <br>
                    <h5 class="header col s12 light">Predict the probability of having Heart Disease using Machine Learning</h5>
                </div>
            </div>
        </div>
    </header>

    <!-- Prediction Form -->
    <div class="ex-basic-1 pt-4">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card">
                        <div class="card-header bg-white">
                            <h3 class="mb-0"><i class="fas fa-stethoscope text-primary mr-2"></i>Enter Health Parameters</h3>
                        </div>
                        <div class="card-body">
                            <form action="/predict" method="post">
                                <div class="form-row">
                                    <div class="form-group col-md-6">
                                        <label>Age</label>
                                        <input type="text" class="form-control" name="1" required>
                                    </div>
                                    <div class="form-group col-md-6">
                                        <label>Sex</label>
                                        <input type="text" class="form-control" name="2" required>
                                    </div>
                                </div>
                                <div class="form-row">
                                    <div class="form-group col-md-6">
                                        <label>Chest Pain Type</label>
                                        <input type="text" class="form-control" name="3" required>
                                    </div>
                                    <div class="form-group col-md-6">
                                        <label>Resting Blood Pressure</label>
                                        <input type="text" class="form-control" name="4" required>
                                    </div>
                                </div>
                                <div class="form-row">
                                    <div class="form-group col-md-6">
                                        <label>Cholesterol</label>
                                        <input type="text" class="form-control" name="5" required>
                                    </div>
                                    <div class="form-group col-md-6">
                                        <label>Fasting Blood Sugar</label>
                                        <input type="text" class="form-control" name="6" required>
                                    </div>
                                </div>
                                <div class="form-row">
                                    <div class="form-group col-md-6">
                                        <label>Resting ECG</label>
                                        <input type="text" class="form-control" name="7" required>
                                    </div>
                                    <div class="form-group col-md-6">
                                        <label>Max Heart Rate</label>
                                        <input type="text" class="form-control" name="8" required>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-primary btn-block">
                                    <i class="fas fa-heartbeat mr-2"></i>Predict
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <div class="container">
            <p class="mb-0">© 2024 ECG Cardiovascular Detection. All rights reserved.</p>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
